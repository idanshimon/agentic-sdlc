name: accuracy-retrospective

# Task 5.1 of adopt-github-native-execution-substrate.
#
# The scheduled compute site for `accuracy_score`. Until this existed, the field
# was declared on every ledger entry and 0.0 on every live row — a learning loop
# that was a schema with no behaviour, while `autopilot_above_threshold` read it
# as though it meant something.
#
# WHAT THIS JOB DOES AND DELIBERATELY DOES NOT DO
#
# It REPORTS. It does not write to the Decision Ledger.
#
# `replay.py` refuses to write, on the grounds that inventing rows to make a
# metric look populated would corrupt the audit substrate this system exists to
# protect. `accuracy_compute.py` and `retrospective.py` hold the same line, and
# tests assert it in all three. Persisting promoted scores is a separate,
# deliberate step that must carry a real actor attribution through the ledger's
# append-only contract — a scheduled job quietly mutating precedent rows would
# be precisely the silent, unattributable agent action this project exists to
# prevent.
#
# Consequence: this workflow is safe to schedule as-is. Its blast radius is an
# issue comment.
#
# WHY IT RUNS WITH NO SECRET
#
# Same posture as bundle-enforce: checked-out repo plus stdlib. No cloud
# credential, no ledger write path, no model call. A governance job that cannot
# reach production data is one fewer thing to defend.
#
# REPRODUCIBILITY
#
# The sample seed is derived from the window id (SHA-256, not `hash()`, which
# Python randomizes per interpreter). The same window always examines the same
# runs, and the seed is printed in the report so an auditor can reproduce it.

on:
  schedule:
    # Mondays 06:00 UTC — a full week of runs in the window, reported before
    # the working week starts.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      window_id:
        description: "Window identifier (also derives the sample seed)"
        required: false
        type: string
      sample_size:
        description: "How many completed runs to examine"
        required: false
        default: "25"
        type: string

permissions:
  contents: read

concurrency:
  # One retrospective at a time. Two concurrent runs would sample the same
  # window and produce contradictory reports.
  group: accuracy-retrospective
  cancel-in-progress: false

jobs:
  retrospective:
    name: accuracy-retrospective
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Resolve window
        id: window
        run: |
          WINDOW="${{ inputs.window_id }}"
          if [ -z "$WINDOW" ]; then
            WINDOW="$(date -u +%Y-W%V)"
          fi
          echo "window_id=$WINDOW" >> "$GITHUB_OUTPUT"
          echo "Window: $WINDOW"

      - name: Collect replay input
        id: collect
        run: |
          # The orchestrator's ledger is not reachable from this job by design
          # (no secret, no network egress to Cosmos). Until a governed export
          # exists, the job runs against a committed fixture when present and
          # reports an empty window otherwise — an empty report is honest; a
          # fabricated one is not.
          if [ -f experiments/retrospective-input.json ]; then
            cp experiments/retrospective-input.json /tmp/retro-input.json
            echo "source=fixture" >> "$GITHUB_OUTPUT"
          else
            echo '{"runs": [], "class_scores": []}' > /tmp/retro-input.json
            echo "source=empty" >> "$GITHUB_OUTPUT"
          fi

      - name: Run retrospective
        working-directory: apps
        run: |
          python -m orchestrator.retrospective \
            --window-id "${{ steps.window.outputs.window_id }}" \
            --input /tmp/retro-input.json \
            --sample-size "${{ inputs.sample_size || '25' }}" \
            --markdown > /tmp/retro.md
          python -m orchestrator.retrospective \
            --window-id "${{ steps.window.outputs.window_id }}" \
            --input /tmp/retro-input.json \
            --sample-size "${{ inputs.sample_size || '25' }}" \
            > /tmp/retro.json
          cat /tmp/retro.md

      - name: Publish to the run summary
        run: |
          {
            cat /tmp/retro.md
            echo ""
            echo "---"
            echo "_Input source: ${{ steps.collect.outputs.source }}. This job reports only —"
            echo "it does not write to the Decision Ledger._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accuracy-retrospective-${{ steps.window.outputs.window_id }}
          path: |
            /tmp/retro.md
            /tmp/retro.json
          retention-days: 90
